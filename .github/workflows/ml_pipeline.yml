name: AETHER — Trigger ML Pipeline

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:

  # Telegram batch trigger from worker.js
  repository_dispatch:
    types: [telegram_batch]

  # Fallback daily schedule (Railway handles the 6-hourly runs)
  schedule:
    - cron: "0 18 * * *"   # 11:30 PM IST

jobs:
  trigger-railway:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deployment
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"environmentId":"${{ secrets.RAILWAY_ENVIRONMENT_ID }}"}' \
            https://backboard.railway.app/graphql/v2
        # Note: replace with Railway CLI trigger once you have the token
        # railway run --service aether-pipeline

      - name: Log trigger
        run: echo "Pipeline triggered at $(date -u)"
