name: AETHER ML Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install pandas scikit-learn numpy requests joblib pyarrow

      - name: Pull events
        run: python scripts/pipeline/pull_events.py
        env:
          WORKER_URL: https://learning-bot.talpadeavi0303.workers.dev

      - name: Clean
        run: python scripts/pipeline/data_cleaner.py

      - name: Train
        run: python scripts/ml/train_models.py

      - name: Predict
        run: python scripts/ml/predict.py

      - name: Push
        run: python scripts/pipeline/push_dashboard.py
        env:
          WORKER_URL: https://learning-bot.talpadeavi0303.workers.dev