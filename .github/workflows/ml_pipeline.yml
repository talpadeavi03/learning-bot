name: AETHER ML Pipeline

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  ml_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn numpy requests joblib pyarrow

      - name: Pull events
        env:
          WORKER_URL: https://learning-bot.talpadeavi0303.workers.dev
        run: python scripts/pipeline/pull_events.py

      - name: Clean data
        run: python scripts/pipeline/data_cleaner.py

      - name: Train model
        run: python scripts/ml/train_models.py

      - name: Predict
        run: python scripts/ml/predict.py

      - name: Push dashboard
        env:
          WORKER_URL: https://learning-bot.talpadeavi0303.workers.dev
        run: python scripts/pipeline/push_dashboard.py

      - name: Commit results
        run: |
          git config --local user.email "aether-bot@noreply.com"
          git config --local user.name "AETHER Bot"
          git add data/ models/ || true
          git diff --staged --quiet || git commit -m "chore: nightly ML [skip ci]"
          git push || true
