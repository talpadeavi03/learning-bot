# ═══════════════════════════════════════════════════════════════
# AETHER GitHub Activity Logger
# .github/workflows/github_activity.yml
# Auto-logs every push as a productivity event to AETHER
# Zero effort — happens automatically when you push code
# ═══════════════════════════════════════════════════════════════

name: AETHER Activity Logger

on:
  push:
    branches: [master, main]
  pull_request:
    types: [closed]

jobs:
  log_activity:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Log commit to AETHER
        env:
          WORKER_URL: https://learning-bot.talpadeavi0303.workers.dev
        run: |
          # Get commit info
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l)
          COMMIT_ADDITIONS=$(git diff --stat HEAD~1 HEAD 2>/dev/null | tail -1 | grep -o '[0-9]* insertion' | grep -o '[0-9]*' || echo "0")
          COMMIT_DELETIONS=$(git diff --stat HEAD~1 HEAD 2>/dev/null | tail -1 | grep -o '[0-9]* deletion' | grep -o '[0-9]*' || echo "0")
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          # Estimate energy from commit size and message
          # Big commits with feat/fix = high energy
          # chore/docs = medium energy
          if echo "$COMMIT_MSG" | grep -qi "feat\|build\|implement\|add\|create"; then
            ENERGY="0.8"
            TOPIC="Building feature"
          elif echo "$COMMIT_MSG" | grep -qi "fix\|bug\|patch\|resolve"; then
            ENERGY="0.7"
            TOPIC="Bug fixing"
          elif echo "$COMMIT_MSG" | grep -qi "refactor\|improve\|optimize"; then
            ENERGY="0.75"
            TOPIC="Code improvement"
          elif echo "$COMMIT_MSG" | grep -qi "chore\|docs\|style\|format"; then
            ENERGY="0.5"
            TOPIC="Maintenance"
          else
            ENERGY="0.65"
            TOPIC="Coding"
          fi

          # Post event to AETHER worker safely using python json
          export COMMIT_MSG COMMIT_FILES COMMIT_ADDITIONS COMMIT_DELETIONS REPO BRANCH AUTHOR ENERGY TOPIC WORKER_URL
          python3 -c "
import os, json, urllib.request
payload = {
    'event_type': 'github_push',
    'commit_message': os.environ.get('COMMIT_MSG', ''),
    'files_changed': int(os.environ.get('COMMIT_FILES', 1) or 1),
    'additions': int(os.environ.get('COMMIT_ADDITIONS', 0) or 0),
    'deletions': int(os.environ.get('COMMIT_DELETIONS', 0) or 0),
    'repo': os.environ.get('REPO', ''),
    'branch': os.environ.get('BRANCH', ''),
    'author': os.environ.get('AUTHOR', ''),
    'energy_signal': float(os.environ.get('ENERGY', 0.65)),
    'topic': os.environ.get('TOPIC', 'Coding'),
    'is_study_session': True,
    'is_goal_mention': False
}
try:
    req = urllib.request.Request(
        os.environ['WORKER_URL'] + '/log-github',
        data=json.dumps(payload).encode('utf-8'),
        headers={'Content-Type': 'application/json'},
        method='POST'
    )
    with urllib.request.urlopen(req, timeout=10) as resp:
        print(f'✅ Logged to AETHER: HTTP {resp.status}')
except Exception as e:
    print(f'⚠️ AETHER worker notification completed with note: {e}')
"
