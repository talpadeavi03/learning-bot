name: Learning Tracker

on:
  repository_dispatch:
    types: [telegram_message]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install requests pytz sentence-transformers scikit-learn

      - name: Show payload
        run: echo '${{ toJson(github.event.client_payload) }}'

      - name: Export payload
        run: |
          echo "MSG_TEXT=${{ github.event.client_payload.text }}" >> $GITHUB_ENV
          echo "MSG_USER=${{ github.event.client_payload.user }}" >> $GITHUB_ENV
          echo "MSG_TIME=${{ github.event.client_payload.timestamp }}" >> $GITHUB_ENV

      - name: Run tracker script
        env:
          TELEGRAM_TEXT: ${{ github.event.client_payload.text }}
        run: |
          python scripts/tracker.py

      - name: Run NLP parser
        run: |
          python scripts/nlp_parser.py

      - name: Generate analytics dashboard
        run: |
          python scripts/analytics.py

      - name: Generate learning dashboard
        run: |
          python scripts/dashboard.py

      - name: Generate learning heatmap
        run: |
          python scripts/heatmap.py

      - name: Generate weekly summary
        run: |
          python scripts/weekly_summary.py

      - name: Generate dashboard data
        run: |
          python scripts/dashboard_data.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "update learning logs, analytics, dashboard" || echo "no changes"
          git push