name: Learning Tracker

on:
  repository_dispatch:
    types: [telegram_message]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests pytz sentence-transformers scikit-learn

      - name: Run tracker script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/tracker.py

      - name: Run NLP parser
        run: |
          python scripts/nlp_parser.py

      - name: Generate analytics dashboard
        run: |
          python scripts/analytics.py

      - name: Generate learning dashboard
        run: |
          python scripts/dashboard.py

      - name: Generate learning heatmap
        run: |
          python scripts/heatmap.py

      - name: Generate weekly summary
        run: |
          python scripts/weekly_summary.py

      - name: Generate dashboard data
        run: |
          python scripts/dashboard_data.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "update learning logs, analytics, dashboard, heatmap, weekly summary, charts" || echo "no changes"
          git push