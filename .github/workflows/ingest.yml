name: Telegram Ingestion

on:
  repository_dispatch:
    types: [telegram_batch]

permissions:
  contents: write

concurrency:
  group: learning-bot-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Ensure directories exist
        run: |
          mkdir -p data/raw

      - name: Save batch payload
        run: |
          echo '${{ toJson(github.event.client_payload.events) }}' > events.json
          cat events.json

      - name: Run NLP parser
        run: python scripts/ingestion/nlp_parser.py

      - name: Commit dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/raw/events.csv

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update dataset"

          git push