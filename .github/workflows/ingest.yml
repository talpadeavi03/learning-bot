name: Telegram Ingestion

on:
  repository_dispatch:
    types: [telegram_message]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-ingest.txt

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Show payload
        run: echo '${{ toJson(github.event.client_payload) }}'

      - name: Export payload
        run: |
          echo "MSG_TEXT=${{ github.event.client_payload.text }}" >> $GITHUB_ENV
          echo "MSG_USER=${{ github.event.client_payload.user }}" >> $GITHUB_ENV
          echo "MSG_TIME=${{ github.event.client_payload.timestamp }}" >> $GITHUB_ENV

      - name: Run tracker
        run: python scripts/tracker.py

      - name: Run NLP parser
        run: python scripts/nlp_parser.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/learning-log.md data/events.csv
          git commit -m "update learning dataset" || echo "no changes"
          git push