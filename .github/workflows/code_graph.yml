name: Build Code Graph

on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "api/**"
      - "site/**"
      - "*.js"
      - "*.py"
      - ".github/workflow/*.yml"

jobs:
  build_graph:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Cache GitNexus
      uses: actions/cache@v4
      with:
        path: GitNexus
        key: gitnexus-${{ runner.os }}

    - name: Clone GitNexus
      run: git clone https://github.com/abhigyanpatwari/GitNexus.git

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "npm"

    - name: Install GitNexus
      run: |
        cd GitNexus/gitnexus
        npm install

    - name: Debug graph
      run: |
        echo "---- code_graph.json ----"
        cat data/code_graph.json

    - name: Ensure data directory
      run: mkdir -p data

    - name: Run GitNexus analysis
      run: |
        mkdir -p data
        cd GitNexus/gitnexus
        npx gitnexus analyze $GITHUB_WORKSPACE | awk 'BEGIN{p=0} /^\{/ {p=1} p' > $GITHUB_WORKSPACE/data/code_graph.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Generate architecture diagram
      run: |
        python scripts/analytics/generate_architecture.py

    - name: Commit graph and architecture
      run: |
        git config --local user.email "aether-bot@noreply.com"
        git config --local user.name "AETHER Bot"

        git add data/code_graph.json || true
        git add docs/aether-live-architecture.html || true

        git diff --staged --quiet || git commit -m "update code graph + architecture [skip ci]"
        git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:master