name: Build Code Graph

on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "api/**"
      - "site/**"
      - "*.js"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache GitNexus
        uses: actions/cache@v4
        with:
          path: GitNexus
          key: gitnexus-${{ runner.os }}

      - name: Clone GitNexus if missing
        run: |
          if [ ! -d "GitNexus" ]; then
            git clone https://github.com/abhigyanpatwari/GitNexus.git
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install GitNexus
        run: |
          cd GitNexus/gitnexus
          npm install

      - name: Ensure directories
        run: mkdir -p data site/data docs

      - name: Run GitNexus analysis
        run: |
          cd GitNexus/gitnexus
          echo "Running GitNexus..."
          npx gitnexus analyze $GITHUB_WORKSPACE --format json > tmp_graph.json || true
          if [ -s tmp_graph.json ]; then
            echo "Graph generated successfully"
            mv tmp_graph.json $GITHUB_WORKSPACE/data/code_graph.json
          else
            echo "Graph empty — using fallback"
            echo '{"nodes":[{"id":"init","label":"init"}],"edges":[]}' > $GITHUB_WORKSPACE/data/code_graph.json
          fi

      - name: Copy graph to site
        run: cp data/code_graph.json site/data/code_graph.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install networkx

      - name: Generate architecture diagram
        run: python scripts/analytics/generate_architecture.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/ docs/ || true
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "update system brain graph [skip ci]"
          git pull --rebase https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} master
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:master