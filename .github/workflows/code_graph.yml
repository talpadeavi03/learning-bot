name: Build Code Graph

on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "api/**"
      - "site/**"
      - "*.js"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_graph:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    # Restore cached GitNexus
    - name: Cache GitNexus
      uses: actions/cache@v4
      with:
        path: GitNexus
        key: gitnexus-${{ runner.os }}

    - name: Clone GitNexus if missing
      run: |
        if [ ! -d "GitNexus" ]; then
          git clone https://github.com/abhigyanpatwari/GitNexus.git
        fi

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "npm"

    - name: Install GitNexus
      run: |
        cd GitNexus/gitnexus
        npm install

    - name: Ensure data directory
      run: mkdir -p data

    - name: Run GitNexus analysis
      run: |
        mkdir -p data
        cd GitNexus/gitnexus

        npx gitnexus analyze $GITHUB_WORKSPACE > tmp_graph.txt

        awk 'BEGIN{p=0} /^\{/ {p=1} p' tmp_graph.txt > $GITHUB_WORKSPACE/data/code_graph.json

    - name: Validate graph
      run: |
        if [ ! -s data/code_graph.json ]; then
          echo "Graph file empty!"
          exit 1
        fi

    - name: Ensure docs directory
      run: mkdir -p docs

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Generate architecture diagram
      run: |
        python scripts/analytics/generate_architecture.py

    - name: Commit graph and architecture
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add data/ || true
        git add docs/ || true

        git diff --staged --quiet || git commit -m "update code graph + architecture [skip ci]"

        git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:master