name: Learning Analytics

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-analytics.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-analytics.txt

      - name: Generate analytics
        run: |
          python scripts/analytics.py
          python scripts/dashboard.py
          python scripts/heatmap.py
          python scripts/weekly_summary.py
          python scripts/dashboard_data.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add logs/learning-log.md data/events.csv

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update learning dataset"

          git pull --rebase
          git push
