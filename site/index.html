<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AETHER AI</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="boot-screen">
  <div class="boot-text" id="boot-text"></div>
</div>

<canvas id="bg-canvas"></canvas>

<div class="container">

  <!-- CORE -->
  <div class="core">
    <div class="orb"></div>
    <h1>AETHER</h1>
    <p id="status">Initializing...</p>
  </div>

  <!-- MAIN GRID ROW -->
  <div class="main-row">

    <!-- ACTIVITY -->
    <div class="panel">
      <h2>Activity</h2>
      <div id="activity"></div>
      <canvas id="activityChart"></canvas>
    </div>

    <!-- CHAT -->
    <div class="panel chatbot">
      <h2>AETHER Chat</h2>

      <div id="chat-box"></div>

      <div class="chat-input">
        <input id="input" placeholder="Ask AETHER...">
        <button onclick="send()">Send</button>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="panel">
      <h2>Insights</h2>
      <div id="insights"></div>
    </div>

  </div>

  <!-- BOTTOM ROW -->
  <div class="bottom-row">

    <div class="panel">
      <h2>System Monitor</h2>
      <div id="system-monitor"></div>
    </div>

    <div class="panel">
      <h2>System Logs</h2>
      <div id="system-logs"></div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>

</body>
</html>
