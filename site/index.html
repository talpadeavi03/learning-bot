<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AETHER — Personal AI OS</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =====================================================
   BLACK + WHITE MINIMAL THEME
===================================================== */

:root{

  /* main accent now white */
  --c:#ffffff;
  --p:#ffffff;
  --g:#ffffff;
  --o:#ffffff;
  --r:#ffffff;

  /* backgrounds */
  --dark:#000000;
  --panel:#0a0a0a;

  /* borders */
  --border:rgba(255,255,255,0.12);

  /* text */
  --text:#ffffff;
  --text2:rgba(255,255,255,0.55);

}

*,*::before,*::after{
box-sizing:border-box;
margin:0;
padding:0
}

html{
font-size:16px;
scroll-behavior:smooth
}

body{
background:#000000;
color:#ffffff;
font-family:'Rajdhani',sans-serif;
font-weight:500;
min-height:100vh;
overflow-x:hidden;
cursor:none
}

/* ================= CURSOR ================= */

#cur,#curd{
position:fixed;
pointer-events:none;
z-index:9999;
transform:translate(-50%,-50%);
transition:transform .1s
}

#cur{
width:22px;
height:22px;
border:1.5px solid #ffffff;
border-radius:50%;
mix-blend-mode:screen
}

#curd{
width:4px;
height:4px;
background:#ffffff;
border-radius:50%
}

@media(hover:none){
#cur,#curd{display:none}
body{cursor:auto}
}

/* ================= HEADER ================= */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px 28px;
border-bottom:1px solid var(--border);
background:#050505;
backdrop-filter:blur(20px);
position:sticky;
top:0;
z-index:200;
gap:10px
}

.logo{
font-family:'Orbitron',sans-serif;
font-weight:900;
font-size:clamp(16px,3.5vw,26px);
letter-spacing:5px;
color:#ffffff;
text-shadow:none;
}

.logo span{
color:#ffffff
}

/* buttons */

.hbtn{
background:transparent;
border:1px solid #ffffff;
color:#ffffff;
padding:8px 18px;
font-family:'Orbitron',sans-serif;
font-size:11px;
font-weight:700;
letter-spacing:3px;
cursor:pointer;
transition:all .25s
}

.hbtn:hover{
background:#ffffff;
color:#000000
}

/* panels */

.panel{
background:#0a0a0a;
border:1px solid var(--border);
padding:20px;
border-radius:4px;
position:relative;
overflow:hidden;
box-shadow:0 4px 32px rgba(0,0,0,.6)
}

/* text */

.pt{
font-family:'Orbitron',sans-serif;
font-size:10px;
font-weight:700;
letter-spacing:4px;
color:#ffffff;
opacity:.7;
margin-bottom:18px;
text-transform:uppercase
}

/* charts + stats */

.bnum{
font-family:'Orbitron',sans-serif;
font-size:clamp(36px,5vw,50px);
font-weight:900;
color:#ffffff;
line-height:1
}

.btrack{
height:7px;
background:rgba(255,255,255,.08);
border-radius:2px;
overflow:hidden
}

.bfill{
height:100%;
background:#ffffff;
width:0%;
transition:width 1.6s
}

</style>
</head>
