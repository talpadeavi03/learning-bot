<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AETHER AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="styles.css">

</head>

<body class="bg-black text-cyan-300">

<header class="flex justify-between p-4 border-b border-cyan-600">

<h1 class="text-xl tracking-widest">AETHER</h1>

<button onclick="toggleChat()" class="bg-cyan-500 text-black px-3 py-1 rounded">
AI
</button>

</header>

<main class="grid grid-cols-1 lg:grid-cols-4 gap-4 p-6">

<!-- METRICS -->
<div class="panel">

<h2>System Metrics</h2>

<div class="metric">
Focus
<div class="bar"><div id="focusBar"></div></div>
</div>

<div class="metric">
Learning
<div class="bar"><div id="learningBar"></div></div>
</div>

<div class="metric">
Productivity
<div class="bar"><div id="productivityBar"></div></div>
</div>

</div>

<!-- ACTIVITY -->
<div class="panel">

<h2>Activity</h2>

<div id="activity"></div>

</div>

<!-- TIMELINE -->
<div class="panel">

<h2>Timeline</h2>

<ul id="timeline"></ul>

</div>

<!-- CHART -->
<div class="panel col-span-2">

<h2>Learning Distribution</h2>

<canvas id="activityChart"></canvas>

</div>

</main>

<!-- CHAT -->
<div id="chatPanel" class="chat hidden">

<div class="chat-header">
AETHER
<button onclick="toggleChat()">X</button>
</div>

<div id="chatMessages"></div>

<div id="thinking" class="thinking hidden">
Analyzing behavioral data...
</div>

<div class="chat-input">

<input id="chatInput" placeholder="Ask AETHER...">

<button onclick="sendChat()">Send</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
