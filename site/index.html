<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AETHER AI</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Particles -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

</head>

<body class="bg-gray-950 text-green-400 min-h-screen">

<!-- PARTICLE BACKGROUND -->
<div id="particles-bg" class="fixed inset-0 -z-10"></div>

<!-- HEADER -->
<header class="flex items-center justify-between p-4 border-b border-green-700">

<h1 class="font-bold text-xl tracking-widest">AETHER</h1>

<button onclick="toggleChat()" class="bg-green-500 px-3 py-2 rounded text-black">
AI
</button>

</header>

<!-- MAIN -->
<main class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

<!-- NEURAL NETWORK -->
<div class="bg-gray-900/70 backdrop-blur p-4 rounded-xl border border-green-700">

<h2 class="mb-2">Neural Activity</h2>

<div id="neuralCanvas" class="h-64"></div>

</div>

<!-- ACTIVITY -->
<div class="bg-gray-900/70 backdrop-blur p-4 rounded-xl border border-green-700">

<h2 class="mb-2">Activity</h2>

<div id="activity"></div>

</div>

<!-- CHART -->
<div class="bg-gray-900/70 backdrop-blur p-4 rounded-xl border border-green-700">

<h2 class="mb-2">Learning Time</h2>

<canvas id="activityChart"></canvas>

</div>

</main>

<!-- CHAT PANEL -->
<div id="chatPanel"
class="fixed bottom-0 right-0 w-full md:w-96 h-[420px] bg-gray-900 border border-green-700 hidden flex flex-col">

<div class="flex justify-between p-3 border-b border-green-700">
<span>AETHER</span>
<button onclick="toggleChat()">X</button>
</div>

<div id="chatMessages" class="flex-1 overflow-auto p-3 text-sm"></div>

<div class="flex gap-2 p-3 border-t border-green-700">

<input id="chatInput"
class="flex-1 bg-gray-950 border border-green-700 rounded p-2"
placeholder="Ask AETHER...">

<button onclick="sendChat()" class="bg-green-500 text-black px-3 rounded">
Send
</button>

<button onclick="startVoice()" class="bg-green-700 px-3 rounded">
🎤
</button>

</div>

</div>

<script src="app.js"></script>

<script>
tsParticles.load("particles-bg",{
background:{color:"#020617"},
particles:{
number:{value:60},
color:{value:"#00ffcc"},
links:{enable:true,color:"#00ffcc",distance:150},
move:{enable:true,speed:1}
}
})
</script>

</body>
</html>
