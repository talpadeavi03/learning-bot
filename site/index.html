<body>

<canvas id="bg"></canvas>

<!-- HERO (VISIBLE BY DEFAULT) -->
<section class="hero" id="hero">

<h1>AETHER</h1>
<p>Personal Behavioral Intelligence</p>

<button onclick="launchAI()">Launch AI</button>

</section>

<!-- CHAT -->
<section id="chat-section" style="display:none;">

<div class="chat-wrapper">

<h2>AETHER</h2>

<div id="chat-box"></div>

<div id="thinking">AETHER is thinking...</div>

<div class="chat-input">

<input id="input" placeholder="Ask AETHER..." />
<button onclick="send()">Send</button>

</div>

</div>

</section>

<!-- DASHBOARD -->
<section id="dashboard" style="display:none;">

<h2>Behavior Dashboard</h2>

<div class="dashboard-grid">

<div class="card">
<h3>Activity Chart</h3>
<canvas id="activityChart"></canvas>
</div>

<div class="card">
<h3>Activity Stream</h3>
<div id="activity"></div>
</div>

<div class="card">
<h3>AI Insights</h3>
<div id="insights"></div>
</div>

</div>

</section>

<script src="app.js"></script>

</body>
