<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ✅ MUST BE FIRST -->
  <meta charset="UTF-8" />

  <!-- ✅ ADD THIS (prevents weird symbols) -->
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

  <!-- ✅ Responsive + cleaner rendering -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AETHER AI</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="container">

  <!-- AETHER CORE -->
  <div class="core">
    <div class="orb"></div>
    <h1>AETHER</h1>
    <p id="status">Initializing system...</p>
  </div>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <h2>Activity Stream</h2>
    <div id="activity"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <h2>Insights</h2>
    <div id="insights"></div>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <input id="input" placeholder="Ask AETHER..." />
    <button onclick="send()">Send</button>
    <div id="chat-box"></div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
