<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AETHER Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background:#010b12;
color:#bde0ea;
font-family:'Rajdhani',sans-serif;
margin:0;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
border-bottom:1px solid rgba(0,255,255,.2);
}

.logo{
font-family:'Orbitron',sans-serif;
color:#00ffff;
letter-spacing:4px;
font-weight:900;
}

.back{
color:#00ffff;
text-decoration:none;
font-family:'Orbitron',sans-serif;
font-size:12px;
letter-spacing:2px;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

.title{
font-family:'Orbitron';
letter-spacing:4px;
margin-bottom:30px;
color:#00ffff;
}

.timeline{
border-left:2px solid rgba(0,255,255,.2);
padding-left:25px;
}

.event{
margin-bottom:25px;
position:relative;
}

.event::before{
content:"";
position:absolute;
left:-33px;
top:6px;
width:10px;
height:10px;
background:#00ffff;
border-radius:50%;
box-shadow:0 0 10px #00ffff;
}

.time{
font-family:'Orbitron';
font-size:12px;
color:#ff00aa;
margin-bottom:5px;
}

.text{
font-size:15px;
opacity:.9;
}

</style>
</head>

<body>

<header>
<div class="logo">AETHER OS</div>
<a href="index.html" class="back">← DASHBOARD</a>
</header>

<div class="container">

<div class="title">TIMELINE</div>

<div class="timeline" id="timeline"></div>

</div>

<script>

async function loadTimeline(){

try{

const res = await fetch("https://aether-api.talpadeavi0303.workers.dev/events")

const data = await res.json()

const container = document.getElementById("timeline")

container.innerHTML=""

data.slice(0,30).forEach(e=>{

const div=document.createElement("div")

div.className="event"

div.innerHTML=`

<div class="time">${new Date(e.timestamp).toLocaleTimeString()}</div>
<div class="text">${e.text}</div>

`

container.appendChild(div)

})

}catch(err){

document.getElementById("timeline").innerHTML="<p>No timeline data yet.</p>"

}

}

loadTimeline()

</script>

</body>
</html>
